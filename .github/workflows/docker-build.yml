name: Docker

# Two jobs, one gate order:
#
#   build-and-validate -- does the Dockerfile still build, do both Compose
#   files still merge/validate, and do the Docker-specific unit tests still
#   pass? This never touches a registry. It runs on every PR, every push,
#   and manual dispatch.
#
#   publish -- main and v* tag pushes only. Builds the image for
#   linux/amd64 + linux/arm64, pushes it to GHCR under a non-promoted
#   `sha-<short>` tag, runs the SAME Trivy policy as security.yml's
#   image-scan job against that pushed digest, and only if the scan passes
#   promotes the digest to its release tags (:latest on main, semver tags
#   on v* tags). A dirty scan therefore never produces a pullable release
#   tag; the untagged digest is garbage-collected by GHCR.
#
# Image vulnerability scanning policy lives in .github/workflows/security.yml
# (which scans an amd64 local build on every push/PR); the publish job below
# applies the identical fixable CRITICAL/HIGH gate to the exact multi-arch
# manifest list that ships.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-compose*.yml"
      - "secrets/*.example"
      - "secrets/README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/unit/test_docker_router_packaging.py"
      - "tests/unit/test_docker_compose.py"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  # Never cancel push-driven runs: a killed run between "scan passed" and
  # "tags promoted" could strand a half-promoted release. Superseded PR
  # runs are still cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-validate:
    name: Build image and validate Compose overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint Dockerfile (BuildKit check)
        run: docker build --check -f Dockerfile .

      - name: Build router image (no push)
        run: docker build -t hpe-networking-mcp-router:ci .

      - name: Validate router overlay standalone
        run: docker compose -f docker-compose.router.yml --profile router config

      - name: Validate router overlay merged with docker-compose.yml
        run: |
          docker compose -f docker-compose.yml -f docker-compose.router.yml \
            --profile router config

      - name: Confirm default `docker compose up` is unaffected
        run: |
          services="$(docker compose -f docker-compose.yml -f docker-compose.router.yml \
            config --services | sort | tr '\n' ' ')"
          expected="ollama redis "
          if [[ "${services}" != "${expected}" ]]; then
            echo "Expected default profile services '${expected}', got '${services}'" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      # The ingestion/redis packages became optional extras, so a bare
      # `uv sync` no longer installs them. Named explicitly to keep this
      # environment exactly what it was before the split -- the suite covers
      # the document parsers and the LanceDB client, and dropping them would
      # quietly stop testing them.
      - name: Install dependencies
        run: uv sync --frozen --group dev --extra ingestion --extra redis

      - name: Docker/Compose unit tests
        run: |
          uv run pytest \
            tests/unit/test_docker_router_packaging.py \
            tests/unit/test_docker_compose.py \
            tests/unit/test_download_indexes.py -v

      - name: Smoke test the built image (no credentials, embedded RAG only)
        run: |
          docker run -d --name mcp-router-ci \
            -p 127.0.0.1:8010:8010 \
            -e MCP_HOST=0.0.0.0 \
            -e MCP_ALLOWED_HOSTS=127.0.0.1:*,localhost:* \
            -e MCP_ALLOWED_ORIGINS=http://127.0.0.1:*,http://localhost:* \
            -e HPE_MCP_ROUTER_MODE=minimal \
            -e HPE_MCP_TOOLSETS=central,glp,rag \
            hpe-networking-mcp-router:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8010/livez >/dev/null; then
              echo "router is live"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8010/livez
          docker logs mcp-router-ci
          docker stop mcp-router-ci
          docker rm mcp-router-ci

  publish:
    name: Publish multi-arch image to GHCR (scan-gated)
    needs: build-and-validate
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Serialize publishes per ref instead of cancelling: killing a run
    # between "scan passed" and "tags promoted" could strand a half-promoted
    # release. Newer commits queue behind the in-flight publish.
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      # Action pinning follows .github/workflows/security.yml's bar: every
      # THIRD-PARTY action below that downloads and executes a binary --
      # the docker/* set, aquasecurity/trivy-action, and astral-sh/setup-uv
      # -- is pinned to an immutable commit SHA with the released version
      # in a trailing comment. actions/checkout and actions/upload-artifact
      # are published by GitHub and keep the repository's `@vN` convention.
      # Dependabot's github-actions ecosystem bumps each SHA (or tag) and
      # its version comment together.
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve staged and promoted tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          short="sha-${GITHUB_SHA::7}"
          {
            echo "stage=${IMAGE}:${short}"
            echo "promoted<<TAGS_EOF"
            if [[ "${REF_TYPE}" == "tag" ]]; then
              echo "${IMAGE}:v${REF_NAME#v}"
              ver="${REF_NAME#v}"
              # Full releases additionally get bare semver + minor tags;
              # prereleases (v1.2.3-rc1) get only their exact v-tag.
              if [[ "${ver}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
                echo "${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              fi
            else
              echo "${IMAGE}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push staged multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.stage }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max

      # Same policy as security.yml `image-scan`: archive the full
      # CRITICAL/HIGH inventory (including unfixed findings), then gate on
      # fixable ones. Scanning the pushed sha-tagged manifest list means the
      # gate sees exactly the bytes that promotion will tag. Like
      # security.yml, the gate inspects the amd64 index payload; arm64 ships
      # the same digest-pinned base image family.
      # trivy-action writes its report to outputs/security/ but does not
      # create the directory (security.yml creates it inline in each run
      # block; these Trivy steps are action steps, so they need their own).
      - name: Create security report directory
        run: mkdir -p outputs/security

      - name: Record the full vulnerability inventory (non-gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.stage }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          format: json
          output: outputs/security/trivy-publish-report.json
          exit-code: "0"

      - name: Fail on fixable CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.stage }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          format: table
          exit-code: "1"
          skip-setup-trivy: "true"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-trivy-report
          path: outputs/security/trivy-publish-report.json
          if-no-files-found: warn
          retention-days: 90

      # Reached only when the scan passed: point the release tags at the
      # scanned digest. Server-side manifest copy -- no rebuild, so what was
      # scanned is exactly what gets tagged.
      - name: Promote scanned digest to release tags
        env:
          STAGE: ${{ steps.tags.outputs.stage }}
          PROMOTED: ${{ steps.tags.outputs.promoted }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            args+=("-t" "${tag}")
          done <<< "${PROMOTED}"
          docker buildx imagetools create "${args[@]}" "${STAGE}"

      - name: Write tag matrix to the run summary
        env:
          STAGE: ${{ steps.tags.outputs.stage }}
          PROMOTED: ${{ steps.tags.outputs.promoted }}
        run: |
          {
            echo "## Published \`${IMAGE}\`"
            echo
            echo "- Scanned digest tag: \`${STAGE}\`"
            echo "- Recovery: if this run was cancelled or lost mid-promotion above, some release tags may already point here while others do not; re-running publish for the same ref re-promotes idempotently from the surviving \`${STAGE}\` stage tag."
            echo "- Promoted release tags:"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] || continue
              echo "  - \`${tag}\`"
            done <<< "${PROMOTED}"
          } >> "$GITHUB_STEP_SUMMARY"
