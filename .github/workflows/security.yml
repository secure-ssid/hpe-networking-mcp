name: Security

# SAST (bandit) and dependency vulnerability (pip-audit) gates.
#
# Secret scanning and Dependabot security updates are already enabled at the
# repository level (Settings -> Security) and need no workflow file. This
# workflow only covers what a repo setting can't: static analysis of our own
# code and a point-in-time CVE check on the resolved dependency set on every
# push/PR, plus a weekly schedule so a newly disclosed CVE is caught even
# without a code change.
#
# The image scan below covers the layer the Python-only scanners above cannot
# see: the Debian base, the interpreter, and any non-Python binary the runtime
# stage copies in (today, uv).
#
# Action pinning in this file: every THIRD-PARTY action is pinned to an
# immutable commit SHA with the released version in a trailing comment --
# astral-sh/setup-uv and aquasecurity/trivy-action alike. Both download and
# execute a binary, so both get the same bar. actions/checkout and
# actions/upload-artifact are published by GitHub and keep the repository's
# `@vN` convention. The rest of the repo pins `@vN` for third-party actions
# too; that is a weaker bar, knowingly accepted for the build/test workflows
# and deliberately not accepted here. Dependabot's `github-actions` entry in
# .github/dependabot.yml bumps the SHA and its version comment together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Commit-pinned, not `@v10.0.0`: see the pinning note in the header.
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The ingestion/redis packages became optional extras, so a bare
      # `uv sync` no longer installs them. They are named explicitly here to
      # keep the audited/scanned environment exactly what it was before the
      # split -- an extra that silently drops out of the resolve is an extra
      # nobody is auditing.
      - name: Install security tooling
        run: uv sync --group security --extra ingestion --extra redis

      # Gate on medium+ severity only; see [tool.bandit] in pyproject.toml
      # for the rationale and the inline `# nosec` policy for confirmed
      # false positives. Low-severity findings are non-blocking background
      # noise for this CLI/pipeline codebase.
      - name: Run bandit (fails on medium+ severity)
        run: |
          mkdir -p outputs/security
          uv run bandit -r src/ -ll -f json -o outputs/security/bandit-report.json
          uv run bandit -r src/ -ll

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-bandit-report
          path: outputs/security/bandit-report.json
          if-no-files-found: warn
          retention-days: 90

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Commit-pinned, not `@v10.0.0`: see the pinning note in the header.
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Same reason as the bandit job above: name the extras so pip-audit
      # still sees playwright/lancedb/fastembed/redis and their transitive
      # trees, which are the largest CVE surface this project pulls in.
      - name: Install project and security tooling
        run: uv sync --group dev --group security --extra ingestion --extra redis

      # Audits the resolved, synced environment directly (no separate
      # requirements.txt export) so results always match what CI actually
      # installs. Our own unpublished package is expected to be skipped.
      - name: Run pip-audit
        run: |
          mkdir -p outputs/security
          uv run pip-audit --format json > outputs/security/pip-audit-report.json
          uv run pip-audit

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-pip-audit-report
          path: outputs/security/pip-audit-report.json
          if-no-files-found: warn
          retention-days: 90

  image-scan:
    name: Trivy (image CVEs)
    runs-on: ubuntu-latest
    # A real build, not a registry pull: the runtime image resolves the whole
    # locked dependency set and indexes the digest-pinned OpenAPI corpus under
    # vendor/openapi/ into data/specs.sqlite in a throwaway stage, so the build
    # is measured in minutes rather than seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same image the Docker workflow builds and the same one an operator
      # gets from `docker build .`; scanning anything else would scan a
      # different artifact than the one that ships.
      - name: Build the runtime image
        run: |
          mkdir -p outputs/security
          docker build -t hpe-networking-mcp:scan .

      # Pinned to an immutable commit rather than the `@master` this scan was
      # originally sketched against. A tag is a movable pointer; a commit SHA
      # is not, and this action's job is to download and execute a scanner
      # binary. That reasoning is not special to Trivy -- it is the same rule
      # the header states for every third-party action here, including the
      # setup-uv pins above. Bump both the SHA and the trailing version
      # comment together.
      - name: Record the full vulnerability inventory (non-gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hpe-networking-mcp:scan
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          format: json
          output: outputs/security/trivy-report.json
          exit-code: "0"

      # The gate. `ignore-unfixed` is not a severity reduction -- severity
      # stays CRITICAL,HIGH -- it drops only findings with no released fix.
      # The Debian stable base currently carries dozens of HIGH/CRITICAL CVEs
      # with no fixed version available upstream; gating on those makes this
      # job permanently red for a reason no commit in this repository can
      # address, which is exactly how a security gate ends up disabled. The
      # unfiltered inventory is still archived by the step above, so nothing
      # is hidden -- only the unactionable is kept out of the pass/fail
      # decision. A finding that reaches this step has a fix, and the fix is
      # to bump the base image or the vendored binary, never to relax this.
      - name: Fail on fixable CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hpe-networking-mcp:scan
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          format: table
          exit-code: "1"
          skip-setup-trivy: "true"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-trivy-report
          path: outputs/security/trivy-report.json
          if-no-files-found: warn
          retention-days: 90
