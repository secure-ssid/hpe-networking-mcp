name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege by default; the drift jobs only ever read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      # The ingestion/redis/tui packages became optional extras, so a bare
      # `uv sync` no longer installs them. Named explicitly to keep this
      # environment exactly what it was before the split -- the suite covers
      # the document parsers, the LanceDB client and the Textual widgets, and
      # dropping them would quietly stop testing them.
      - name: Install dependencies
        run: uv sync --group dev --extra ingestion --extra redis --extra tui

      # Whole-tree, not a file list. The previous form named ~20 paths
      # explicitly, so every module added after it was written -- and every
      # module nobody remembered to append -- was silently unlinted. A gate
      # that only inspects what someone remembered to enrol is not a gate.
      #
      # Widening it surfaced 443 findings across 78 files (E501, plus I001
      # and F401 fixed by `--fix`). All of them are fixed in the tree, none
      # are suppressed: there is no `exclude`, no `per-file-ignores` and no
      # `# noqa` carrying this. `[tool.ruff]` in pyproject.toml holds the
      # line-length and the E/F/I rule selection, so this step and a local
      # `ruff check .` agree by construction.
      - name: Ruff lint
        run: uv run ruff check .

      # Matrix jobs stay artifact-free and exercise every unit/protocol test
      # plus code-derived catalog facts. The separate strict-index job rebuilds
      # the tool index from committed specs and runs the non-skipping
      # API/tool-index contract once per commit.
      - name: Unit tests and tool catalog gate
        run: uv run python scripts/validate_release.py --skip-rag

  typecheck:
    name: Type check (strict, scoped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      # 3.12 specifically, and no optional extras. Two reasons, both load
      # bearing. mypy targets the interpreter it runs on unless pinned, and
      # it cannot be pinned to this package's 3.10 floor because numpy's
      # bundled stubs use 3.12-only syntax that aborts the whole run -- see
      # the note in [tool.mypy]. numpy arrives with the `ingestion` extra,
      # so this job also declines the extras the other jobs name explicitly:
      # nothing in the gated module set imports them, and the default
      # six-dependency install is the one most operators actually get.
      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      # Scoped on purpose. `[tool.mypy]` in pyproject.toml names the exact
      # modules this covers -- the write gate and HTTP transport, the
      # middleware chain, the exact-API index, and the derived fact snapshot
      # -- and they pass `strict` outright: no `ignore_missing_imports`, no
      # baseline ignore list, no `# type: ignore`. The rest of the tree is
      # not type-checked and that config records the measured error count
      # rather than implying otherwise, because a tree-wide run bought with
      # suppressions would read like a guarantee this project cannot make.
      # Widen `files` there, one annotated module at a time; never widen it
      # by relaxing anything here.
      - name: mypy (see [tool.mypy] in pyproject.toml for the covered set)
        run: uv run mypy

  package:
    name: Build and install package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and source distribution
        run: uv build

      - name: Install wheel and smoke-test console scripts
        run: |
          uv venv .package-smoke --python 3.12
          wheel=$(ls dist/*.whl)
          uv pip install --python .package-smoke/bin/python "$wheel"
          timeout 10s .package-smoke/bin/hpe-mcp-router --help
          .package-smoke/bin/hpe-mcp-doctor --help
          .package-smoke/bin/hpe-mcp-run-pipeline --help
          .package-smoke/bin/hpe-mcp-run-ssid --help
          rm -rf .package-smoke

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  strict-index:
    name: Strict tool index
    needs: test
    # No opt-in variable: this job rebuilds the tool index from OpenAPI specs
    # committed to this repository, so it needs no published artifact and can
    # be a required status check on every commit.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The ingestion/redis/tui packages became optional extras, so a bare
      # `uv sync` no longer installs them. Named explicitly to keep this
      # environment exactly what it was before the split -- the suite covers
      # the document parsers, the LanceDB client and the Textual widgets, and
      # dropping them would quietly stop testing them.
      - name: Install dependencies
        run: uv sync --group dev --extra ingestion --extra redis --extra tui

      # The RAG prose corpus is deliberately not published (it is scraped vendor
      # documentation), so CI cannot restore it and does not assert --strict-rag.
      # Everything else here is derived from committed inputs and is gated for
      # real: the tool catalog by importing the MCP server modules, and
      # data/specs.sqlite by indexing the vendored vendor/openapi corpus.
      - name: Rebuild the tool catalog index
        run: uv run python scripts/ingest_tools.py --complete-catalog

      # Offline, no network: the OpenAPI documents are committed. This is what
      # makes indexes.offline_derivable in docs/project-facts.json a fact CI
      # can check rather than a number from one workstation.
      - name: Build the exact-API index from the committed corpus
        run: uv run python scripts/build_spec_index.py

      - name: Reconcile rebuilt index manifests
        run: uv run python scripts/package_indexes.py --write-local-manifests

      # No --ignore-index-facts: the scrape-derived counts are skipped as "not
      # built" on their own, while --strict-index-facts requires the offline
      # OpenAPI counts built two steps up to be present and compared, so this
      # job cannot pass by having skipped them.
      #
      # No --min-tools: the floor defaults to docs/project-facts.json's
      # tools.platform_backend_total. A number typed here is a second copy of
      # a published fact, and it drifted -- this gate enforced 6703 while every
      # doc promised 6711.
      - name: Validate strict exact-API and tool-index contract
        run: >-
          uv run python scripts/validate_release.py
          --skip-tests
          --skip-rag
          --strict-tool-index
          --strict-index-facts
          --catalog-products all

  # --- Source/API/RAG drift gates -----------------------------------------
  # One job per check, deliberately never combined into a single shell block:
  # a failing early check must not hide a later one, and each job uploads its
  # own machine-readable report so the summary job can classify every result
  # (fresh / content_drift / source_added / source_removed / pointer_change /
  # stale_pin / unavailable / parser_error / coverage_gap / not_checked).
  # Exit codes are per class -- see
  # src/hpe_networking_mcp/pipeline/drift_taxonomy.py.

  product-spec-freshness:
    # Fully offline (manifest + on-disk derivation only), so it runs on every
    # event rather than only on the schedule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check api-next product spec manifest freshness
        run: >-
          uv run python scripts/check_product_spec_freshness.py
          --json-artifact outputs/drift/product-spec-freshness.json

      - name: Upload product-spec freshness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-product-spec-freshness
          path: outputs/drift/product-spec-freshness.json
          if-no-files-found: warn
          retention-days: 90

  rag-source-drift:
    # Offline: resolves each source's URL inventory and prints the refresh
    # plan without fetching anything. External source refresh is disabled, so
    # sources are reported not_checked -- never fresh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The ingestion/redis/tui packages became optional extras, so a bare
      # `uv sync` no longer installs them. Named explicitly to keep this
      # environment exactly what it was before the split -- the suite covers
      # the document parsers, the LanceDB client and the Textual widgets, and
      # dropping them would quietly stop testing them.
      - name: Install dependencies
        run: uv sync --group dev --extra ingestion --extra redis --extra tui

      - name: Resolve RAG source inventory (offline)
        run: >-
          uv run python ingestion/check_updates.py --offline --dry-run
          --exit-code-mode classified
          --json-artifact outputs/drift/rag-source-freshness.json

      - name: Print refresh plan (no execution, no network)
        run: |
          mkdir -p outputs/drift
          uv run python scripts/refresh_rag_sources.py --plan \
            > outputs/drift/refresh-plan.json

      - name: Upload RAG source drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-rag-source
          path: outputs/drift/
          if-no-files-found: warn
          retention-days: 90

  openapi-registry-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check Aruba developer-portal OpenAPI registries
        run: >-
          uv run python scripts/check_openapi_drift.py
          --json-artifact outputs/drift/openapi-registry-drift.json

      - name: Upload OpenAPI registry drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-openapi-registry
          path: outputs/drift/openapi-registry-drift.json
          if-no-files-found: warn
          retention-days: 90

  mist-openapi-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check official Mist OpenAPI reviewed pin
        run: >-
          uv run python scripts/check_mist_openapi_drift.py --verify-pinned-digest
          --json-artifact outputs/drift/mist-openapi-drift.json

      - name: Upload Mist OpenAPI drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-mist-openapi
          path: outputs/drift/mist-openapi-drift.json
          if-no-files-found: warn
          retention-days: 90

  nowireless-community-drift:
    # Community benchmark/input freshness ONLY. The absent official HPE
    # GreenLake registry boundary is reported by the same check as a separate
    # coverage_gap finding -- community freshness is never HPE API freshness.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check nowireless4u/hpe-networking-mcp community input pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python scripts/check_nowireless_source_drift.py
          --json-artifact outputs/drift/nowireless-community-input-drift.json

      - name: Upload community-input drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-nowireless-community-input
          path: outputs/drift/nowireless-community-input-drift.json
          if-no-files-found: warn
          retention-days: 90

  security-lifecycle-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The ingestion/redis/tui packages became optional extras, so a bare
      # `uv sync` no longer installs them. Named explicitly to keep this
      # environment exactly what it was before the split -- the suite covers
      # the document parsers, the LanceDB client and the Textual widgets, and
      # dropping them would quietly stop testing them.
      - name: Install dependencies
        run: uv sync --group dev --extra ingestion --extra redis --extra tui

      - name: Check official security and lifecycle sources
        run: >-
          uv run python scripts/check_security_lifecycle_drift.py
          --drift-artifact-path outputs/drift/security-lifecycle-drift.json

      - name: Upload source-freshness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-freshness
          path: outputs/source-freshness.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload security/lifecycle drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-security-lifecycle
          path: outputs/drift/security-lifecycle-drift.json
          if-no-files-found: warn
          retention-days: 90

  drift-summary:
    # Always runs, even when an individual gate failed: the whole point is to
    # show every check's class, including the ones that produced no artifact.
    if: always()
    needs:
      - product-spec-freshness
      - rag-source-drift
      - openapi-registry-drift
      - mist-openapi-drift
      - nowireless-community-drift
      - security-lifecycle-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Download drift reports
        uses: actions/download-artifact@v8
        with:
          path: outputs/drift
          pattern: drift-*
          merge-multiple: true

      - name: Aggregate drift summary
        run: >-
          uv run python scripts/summarize_drift_artifacts.py
          --input-dir outputs/drift
          --output outputs/drift/summary.json
          --markdown "$GITHUB_STEP_SUMMARY"
          --never-fail

      - name: Upload aggregate drift summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-summary
          path: outputs/drift/summary.json
          if-no-files-found: warn
          retention-days: 90
