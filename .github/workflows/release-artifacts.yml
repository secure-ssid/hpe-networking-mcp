name: Release

# Releases are deliberately operator-triggered. This workflow rebuilds the
# router tool index from the MCP server modules committed to this repository,
# runs the strict release contract, then creates or updates the product
# release and tag.
#
# The RAG prose corpus (data/docs.lance) is NEVER published. It is scraped
# third-party vendor documentation; republishing it would redistribute HPE,
# Aruba, Juniper, and Mist content that this project has no licence to
# redistribute. Operators build it locally with ingestion/ingest_docs.py.
#
# The OpenAPI spec index (data/specs.sqlite) IS published, as
# spec-index-<tag>.tar.gz, its .sha256 sidecar, and a spec-index-manifest.json
# pin carrying the archive's real digest. It is built here from
# vendor/openapi/, whose 31 documents are committed, digest-pinned and
# redistributable, so nothing scraped goes into it. The same database is baked
# into the container image, and anyone can rebuild it offline in seconds with
# `python scripts/build_spec_index.py`, so this asset is a convenience rather
# than the only way to get an index.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, matching pyproject.toml (for example v0.8.0)
        required: true
        type: string
      draft:
        description: Leave the GitHub Release as a draft
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-build-publish:
    name: Validate, build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The ingestion/redis/tui packages became optional extras, so a bare
      # `uv sync` no longer installs them. Named explicitly to keep this
      # environment exactly what it was before the split -- the suite covers
      # the document parsers, the LanceDB client and the Textual widgets, and
      # dropping them would quietly stop testing them.
      - name: Install dependencies
        run: uv sync --group dev --extra ingestion --extra redis --extra tui

      - name: Validate tag and release-notes version
        id: release_meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              raise SystemExit("release tag must start with 'v'")
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match pyproject version v{version}")
          notes = pathlib.Path(f"docs/release-notes-{version}.md")
          if not notes.is_file():
              raise SystemExit(f"missing release notes: {notes}")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"notes={notes}\n")
          PY

      - name: Build the tool index from committed server modules
        # The tool catalog is DERIVED by importing the MCP server modules in
        # this repository, so it rebuilds deterministically here. The RAG prose
        # corpus (data/docs.lance) is neither built nor published: it is
        # scraped third-party vendor documentation, and
        # ingestion/source_manifest.json already states "Do not commit scraped
        # content". Operators build it locally under their own acceptance of
        # each vendor's terms (`uv run python ingestion/ingest_docs.py`).
        # data/specs.sqlite is built further down, from vendor/openapi/.
        run: uv run python scripts/ingest_tools.py --complete-catalog

      - name: Run complete strict release validation
        # No --strict-rag: the prose corpus is intentionally absent in CI, and
        # validate_release.py skips the eval gate cleanly when it is missing.
        run: >-
          uv run python scripts/validate_release.py
          --strict-tool-index
          --catalog-products all
          --min-tools 6703

      - name: Build wheel and source distribution
        run: uv build

      - name: Build and package the OpenAPI spec index
        # vendor/openapi/ holds 31 committed, digest-pinned, redistributable
        # OpenAPI documents, so this is a pure offline rebuild -- the same one
        # the Dockerfile's specindex stage runs.
        env:
          TAG: ${{ inputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p data dist
          uv run python scripts/build_spec_index.py data/specs.sqlite
          uv run python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tempfile

          from hpe_networking_mcp.pipeline.release_packaging import build_deterministic_archive

          tag = os.environ["TAG"]
          server = os.environ["SERVER_URL"]
          if not server.startswith("https://"):
              raise SystemExit(f"refusing to pin a non-https download URL: {server}")

          archive = pathlib.Path(f"dist/spec-index-{tag}.tar.gz")
          # Staged alone so the archive carries exactly one member, and built
          # with the release packaging primitives rather than `tar -czf`: fixed
          # mtime/uid/gid/mode, fixed gzip header, sorted entries. Two runs over
          # one index then yield one digest, so the published sha256 is a
          # property of the index and not of the clock the release ran on.
          # arcname_prefix is data/ because scripts/download_indexes.py rejects
          # every archive member outside it. The staging directory sits in dist/
          # so the hard link cannot cross a filesystem boundary.
          with tempfile.TemporaryDirectory(dir="dist") as staging:
              staged = pathlib.Path(staging)
              os.link("data/specs.sqlite", staged / "specs.sqlite")
              sha256 = build_deterministic_archive(staged, archive, arcname_prefix="data")

          checksum = archive.with_name(f"{archive.name}.sha256")
          checksum.write_text(f"{sha256}  {archive.name}\n", encoding="utf-8")

          url = f"{server}/{os.environ['REPOSITORY']}/releases/download/{tag}/{archive.name}"
          manifest = pathlib.Path("dist/spec-index-manifest.json")
          manifest.write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "release": tag,
                      "archive": archive.name,
                      "url": url,
                      "checksum_url": f"{url}.sha256",
                      "sha256": sha256,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          # Fail the release here rather than publish a pin the restorer would
          # reject on the operator's machine. This is the same validator
          # scripts/download_indexes.py --manifest runs, not a copy of it.
          sys.path.insert(0, ".")
          from scripts.download_indexes import _load_pinned_manifest

          _load_pinned_manifest(manifest)
          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Build release evidence bundle
        id: evidence
        run: |
          uv run python scripts/build_release_bundle.py \
            --version "${{ inputs.tag }}" \
            --output-dir dist \
            --no-indexes
          archive=$(ls "dist/hpe-networking-mcp-release-artifacts-${{ inputs.tag }}.tar.gz")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Restore and smoke-test release evidence bundle
        run: >-
          uv run python scripts/restore_release_bundle.py
          "${{ steps.evidence.outputs.archive }}"

      - name: Build release subject checksums
        id: subjects
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib

          paths = {
              *pathlib.Path("dist").glob("*.whl"),
              *pathlib.Path("dist").glob("*.tar.gz"),
              pathlib.Path(os.environ["EVIDENCE_ARCHIVE"]),
              pathlib.Path("dist/spec-index-manifest.json"),
              pathlib.Path(f"dist/{os.environ['TAG']}/sbom.json"),
              pathlib.Path(f"dist/{os.environ['TAG']}/provenance.json"),
          }

          def sha256(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          output = pathlib.Path("dist/release-subject-checksums.txt")
          with output.open("w", encoding="utf-8") as handle:
              for path in sorted(paths):
                  handle.write(f"{sha256(path)}  {path.as_posix()}\n")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as workflow:
              workflow.write(f"path={output}\n")
          PY
        env:
          TAG: ${{ inputs.tag }}
          EVIDENCE_ARCHIVE: ${{ steps.evidence.outputs.archive }}

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.tag }}
          path: |
            dist/*.whl
            dist/hpe_networking_mcp-*.tar.gz
            ${{ steps.evidence.outputs.archive }}
            ${{ steps.evidence.outputs.checksum }}
            dist/spec-index-${{ inputs.tag }}.tar.gz
            dist/spec-index-${{ inputs.tag }}.tar.gz.sha256
            dist/spec-index-manifest.json
            dist/${{ inputs.tag }}/sbom.json
            dist/${{ inputs.tag }}/provenance.json
            ${{ steps.subjects.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ steps.subjects.outputs.path }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ steps.release_meta.outputs.notes }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          EVIDENCE_ARCHIVE: ${{ steps.evidence.outputs.archive }}
          EVIDENCE_CHECKSUM: ${{ steps.evidence.outputs.checksum }}
        run: |
          create_flags=(--draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            create_flags+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(
              gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq .isDraft
            )
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG is already published; refusing to replace immutable assets." >&2
              exit 1
            fi
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "hpe-networking-mcp $TAG" \
              --notes-file "$NOTES" \
              --draft=true \
              --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "hpe-networking-mcp $TAG" \
              --notes-file "$NOTES" \
              "${create_flags[@]}"
          fi

          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*.whl \
            dist/hpe_networking_mcp-*.tar.gz \
            "$EVIDENCE_ARCHIVE" \
            "$EVIDENCE_CHECKSUM" \
            "dist/spec-index-$TAG.tar.gz" \
            "dist/spec-index-$TAG.tar.gz.sha256" \
            dist/spec-index-manifest.json \
            "dist/$TAG/sbom.json" \
            "dist/$TAG/provenance.json" \
            dist/release-subject-checksums.txt

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft="$DRAFT" \
            --prerelease="$PRERELEASE"
