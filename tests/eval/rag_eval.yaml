# RAG evaluation set for hpe-networking-mcp — run before/after any backend or retrieval change.
# type: api-lookup      -> expects an exact field/enum/endpoint (ideally via lookup_api over the specs)
#       howto           -> expects a relevant prose chunk (via search_docs)
#       advisory        -> exact structured lookup via lookup_advisory
#       lifecycle       -> exact structured lookup via check_product_lifecycle
#       list-advisories -> bounded/paginated exact filtering via list_advisories
#       list-lifecycle  -> bounded/paginated exact filtering via list_lifecycle_events
#       correlate       -> exact-only advisory<->lifecycle linking via correlate_advisory_lifecycle
#       diagnostics     -> bounded RAG index diagnostics via rag_diagnostics
# expect_sources    -> substrings; at least one must appear in a top-k result's file_path/source.
#                       For the four structured types above, the whole returned
#                       dict is treated as one hit, so this may match any
#                       nested field (e.g. a pagination or correlation key),
#                       not just file_path/source.
# expect_keywords   -> substrings; at least one must appear in the returned text (case-insensitive)
# expect_empty      -> true asserts the tool correctly found *nothing* in these
#                       official sources (negative query / documented
#                       coverage gap) — a non-empty fabricated answer would be
#                       scored as a failure, not a fabricated pass.
# max_duplicate_ratio -> optional upper bound on duplicate/near-identical hits
#                        across the returned top-k sample (0.0 = no duplicates).
# max_latency_ms      -> optional upper bound on query latency measured by the
#                        eval harness for this case.
# See docs/architecture/RAG-ARCHITECTURE.md and docs/source-lifecycle-coverage.md.

questions:
  - id: dot1x-auth-profile-endpoint
    type: api-lookup
    query: "What ArubaOS JSON API endpoint configures a dot1x authentication profile?"
    expect_sources: ["product_specs/aos8-arubaos-json-api-specification.json"]
    expect_keywords: ["POST /object/dot1x_auth_profile"]

  - id: auth-type-enum
    type: api-lookup
    query: "What are the valid auth-type enum values for an auth profile?"
    expect_sources: ["cda-auth-profile", "auth-profile", "config-wireless", "config-interfaces", "config-security", "config-central-nac"]
    expect_keywords: ["MPSK", "EAP", "CAPTIVE_PORTAL", "MAB", "AIRPASS"]

  - id: glp-company-workspace
