    expect_sources: ["juniper_security_advisories"]
    expect_keywords: ["Apstra", "CVE-2025-13914"]

  - id: lifecycle-mist-edge
    type: lifecycle
    query: "Show lifecycle milestones for Mist Edge"
    arguments:
      product: "Mist Edge"
    expect_sources: ["juniper_lifecycle"]
    expect_keywords: ["Mist Edge", "milestone"]

  - id: lifecycle-aruba-hardware
    type: lifecycle
    query: "Find lifecycle records for HP 7500 Switch Chassis"
