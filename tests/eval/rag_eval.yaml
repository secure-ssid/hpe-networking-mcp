    expect_sources: ["lifecycle_notices"]
    expect_keywords: ["HP 7500", "Product SKU"]

  - id: negative-advisory-bogus-cve
    type: advisory
    query: "Look up advisory for a CVE that does not exist"
    arguments:
      cve: "CVE-1999-00001"
    expect_empty: true

  - id: negative-lifecycle-bogus-sku
    type: lifecycle
    query: "Find lifecycle records for a SKU that was never issued"
    arguments:
      product: "ZZZ-NONEXISTENT-SKU-000"
    expect_empty: true

  - id: lifecycle-current-aruba-coverage-gap
    type: lifecycle
    query: "Show the lifecycle record for the Aruba AP-635 access point"
    arguments:
      product: "AP-635"
    # AP-635 is a current (post-2020) Aruba-branded AP. There is no
    # reliable official machine-readable current-Aruba-lifecycle source
    # (docs/source-lifecycle-coverage.md); an empty result here is the
    # correct, honest answer -- not "still supported".
    expect_empty: true

  - id: list-advisories-critical-security-family
    type: list-advisories
    query: "List critical HPE Aruba Networking security advisories"
    arguments:
      source_family: "security_advisories"
      min_severity: "critical"
      limit: 5
    expect_sources: ["security_advisories"]
    expect_keywords: ["Critical", "total_matched"]

  - id: list-lifecycle-switches-category
    type: list-lifecycle
    query: "List lifecycle notices in the Switches category"
    arguments:
      category: "Switches"
      source_family: "lifecycle_notices"
      limit: 3
    expect_sources: ["lifecycle_notices"]
    expect_keywords: ["Switches"]

  - id: correlate-apstra-cve-exact-labeling
