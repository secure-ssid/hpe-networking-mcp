oauth:
  token_url: /oauth2/token
  client_id: benchmark-client
  client_secret: benchmark-secret
  audience: aruba-central.example.com
  # Token issuance is simulated by `FakeCentralServer._handle_token`
  # (tests/fake_central/server.py); this file only binds the token request to
  # the real client flow. `token_url` is read back by the server and threaded
  # to both the solver and the scorer, so moving it here moves it everywhere.