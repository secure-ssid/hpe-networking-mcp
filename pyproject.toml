[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpe-networking-mcp"
version = "0.10.0"
description = "Low-token HPE Networking MCP router (3 discovery/dispatch tools) over a 6,728-tool backend catalog for Aruba Central, GreenLake Platform, AOS8 migrations, Mist, ClearPass, Apstra, EdgeConnect, UXI, Axis Atmos, RAG, and OpenAPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "ai-for-networking",
    "apstra",
    "aruba-api",
    "aruba-central",
    "aruba-central-mcp",
    "aruba-mcp",
    "arubaos8",
    "aos8-migration",
    "axis-atmos",
    "clearpass",
    "edgeconnect-acl-groups",
    "edgeconnect-bypass",
    "edgeconnect",
    "edgeconnect-interface-labels",
    "edgeconnect-link-integrity",
    "edgeconnect-services",
    "edgeconnect-zones",
    "mcp-python-sdk",
    "greenlake",
    "greenlake-mcp",
    "greenlake-platform",
    "greenlake-reporting",
    "greenlake-service-catalog",
    "hpe-aruba-uxi",
    "hpe-aruba-networking",
    "hpe-greenlake",
    "hpe-networking",
    "low-token-router",
    "mcp-server",
    "mist",
    "model-context-protocol",
    "network-automation",
    "openapi",
    "rag",
    "uxi",
    "user-experience-insight",
    "zone-based-firewall",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27.0",
    # Live MCP backends: central-streaming and mist both open WSS sessions
    # from module scope (mcp_servers/central_streaming.py,
    # mcp_servers/mist.py), so this is server runtime, not pipeline weight.
    "websockets>=14.0",
]

[project.optional-dependencies]
# The document pipeline: scraping, office/PDF extraction, chunking, embedding
# and the LanceDB vector store. None of it is reachable from serving MCP
# tools -- `playwright` has no import site under src/ at all -- and it is the
# bulk of the installed footprint, so it is opt-in. Every import site
# degrades through hpe_networking_mcp.optional_deps, naming this command.
#
# This extra alone must be sufficient for the documented corpus build
# (`uv sync --extra ingestion && uv run python ingestion/ingest_docs.py`);
# tests/unit/test_runtime_imports.py runs that command with every other
# extra blinded, so a module-scope import reaching across the split fails CI.
ingestion = [
    "playwright>=1.58.0",
    "beautifulsoup4>=4.15.0",
    "langchain-text-splitters>=0.2.0",
    "pypdf>=6.14.2",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "lancedb>=0.33.0",
    "fastembed>=0.8.0",
]
# Legacy Redis Stack vector backend (HPE_MCP_RAG_BACKEND=redis, and
# `ingestion/ingest_docs.py --backend redis`). Deliberately *not* folded into
# `ingestion`: the default corpus build is LanceDB + SQLite end to end and
# never touches this client, so shipping a server dependency to everyone who
# wants the embedded path would be weight for nothing. numpy rides with it:
# pipeline/clients/redis_client.py is its only import site in the whole
# package, packing query vectors to float32 bytes for Redis.
redis = [
    "redis>=8.0.1",
    "numpy>=2.2.6",
]
milvus-lite = [
    "pymilvus[milvus-lite]>=2.5.0,<3",
]
# Everything, for a checkout that wants the full feature set in one command.
all = [
    "hpe-networking-mcp[ingestion,redis,milvus-lite]",
]

[project.scripts]
hpe-mcp-router = "hpe_networking_mcp.mcp_servers.tool_router:main"
hpe-mcp-doctor = "hpe_networking_mcp.cli.doctor:main"
hpe-mcp-run-pipeline = "hpe_networking_mcp.cli.run_pipeline:main"
hpe-mcp-run-ssid = "hpe_networking_mcp.cli.run_ssid:main"

[project.urls]
Homepage = "https://secure-ssid.github.io/hpe-networking-mcp/"
Repository = "https://github.com/secure-ssid/hpe-networking-mcp"
Documentation = "https://secure-ssid.github.io/hpe-networking-mcp/"
Issues = "https://github.com/secure-ssid/hpe-networking-mcp/issues"
Changelog = "https://github.com/secure-ssid/hpe-networking-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.8.0", "mypy>=1.15.0"]
security = ["bandit>=1.9.0", "pip-audit>=2.9.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hpe_networking_mcp*"]

[tool.setuptools.package-data]
"hpe_networking_mcp.mcp_servers.openapi_gen" = ["manifests/*.json", "overrides/*.json", "provenance/*.json"]
"hpe_networking_mcp.mcp_servers.skills" = ["*.md"]
# design icons live under resources/ (not package data)

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# A real gate on a deliberately small surface, not a tree-wide formality.
#
# `files` below is the whole of what this project type-checks, and every
# module in it passes `strict` with no `ignore_missing_imports`, no
# `# type: ignore`, and no per-module relaxations. The set was chosen for
# blast radius rather than convenience: the write gate and HTTP transport
# (`mcp_servers/shared.py`), the middleware chain that does rate limiting,
# audit logging and secret/PII tokenization (`mcp_servers/_middleware/`), and
# the two modules whose job is to report facts truthfully -- the exact-API
# index (`pipeline/clients/specs_index.py`) and the derived fact snapshot
# behind docs/project-facts.json (`pipeline/project_facts.py`).
#
# The rest of the tree is NOT type-checked, and this file does not pretend
# otherwise. Measured 2026-08-21 against src/hpe_networking_mcp (150 modules):
# `--strict` reports 397 errors in 71 modules; without `--strict` but with
# `--ignore-missing-imports` it is 144 errors in 43 modules. That debt is a
# known number, not a vague one.
#
# Expansion path: pick one module, annotate it until `mypy --strict <module>`
# is clean on its own, then add it to `files`. Never widen `files` and then
# buy the pass back with an ignore or an override -- a gate that suppresses
# what it finds asserts nothing, and a future reader would reasonably read
# its presence as "this codebase is type-checked".
#
# `follow_imports = "silent"` lets types flow in from the unchecked majority
# without reporting their errors; it is what makes incremental adoption
# possible and it is the only concession here.
#
# No `python_version` pin. Setting it to this package's 3.10 floor makes mypy
# hard-fail parsing numpy's bundled stubs (PEP 695 `type` statements, 3.12+),
# which arrive transitively through the optional `ingestion` extra and abort
# the run before it checks a single line of our code. The gate therefore
# targets whichever interpreter mypy runs on (3.12 in CI). Floor
# compatibility is not left unchecked: the ci.yml test matrix runs the whole
# suite on 3.10 and 3.11, which imports every one of these modules for real.
strict = true
follow_imports = "silent"
files = [
    "src/hpe_networking_mcp/mcp_servers/shared.py",
    "src/hpe_networking_mcp/mcp_servers/_middleware",
    "src/hpe_networking_mcp/pipeline/clients/specs_index.py",
    "src/hpe_networking_mcp/pipeline/project_facts.py",
]

[tool.bandit]
# CI gates on medium+ severity only (see .github/workflows/security.yml).
# Low-severity findings (assert usage in application code, subprocess
# invocation, try/except/pass, etc.) are common, low-risk patterns in this
# CLI/pipeline codebase and are tracked as background noise, not a release
# gate. Every medium+ finding is either fixed or annotated inline with a
# scoped `# nosec <TEST_ID>` plus a one-line justification comment at the
# exact flagged line -- never a blanket test-id skip here.
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: subprocess-based or otherwise expensive tests (several seconds or more); still run by default, but a useful selector via `-m \"not slow\"` for a fast local loop",
]
