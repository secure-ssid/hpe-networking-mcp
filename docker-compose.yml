# Optional localhost-only backing services for a RAG-enabled install: Redis
# Stack as the `HPE_MCP_RAG_BACKEND=redis` vector store, Ollama for local
# generation. Neither is required by the router.
#
# They are in the default profile, so a bare `docker compose up` starts them
# and nothing else -- unchanged, and the behaviour docker-build.yml asserts.
# But the published router image installs no `redis` client (it lives in the
# `redis` extra) and no LanceDB stack (the `ingestion` extra), so starting
# these alongside it buys nothing: use
# `docker compose -f docker-compose.yml -f docker-compose.router.yml \
#    --profile router up -d mcp-router` to start the router on its own.
# Start these deliberately, when running from source or from an image built
# with the matching extra -- see docs/production-deployment.md.

services:
  redis:
    image: redis/redis-stack@sha256:5d5154123426693540ea6c1d9e638eae2bf2024879c839db6fcfdd7717e817c7  # digest-pinned 2026-08-22
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"  # RedisInsight local web UI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    restart: unless-stopped

  ollama:
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700  # digest-pinned 2026-08-22
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment for GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  redis_data:
  ollama_data:
