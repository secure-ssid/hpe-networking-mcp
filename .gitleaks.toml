# Gitleaks configuration for hpe-networking-mcp.
#
# Policy: extend the upstream default ruleset and carve out only surgical,
# documented false positives. Every entry below names the exact value shapes
# or vendored paths found by the 2026-08-22 baseline scan (47 findings, all
# accounted for here). A broad path carve-out such as "all of tests/" or
# "all of src/" is deliberately NOT used: it would silence a real secret
# committed to those trees, which is precisely the failure mode this config
# exists to prevent.
#
# gitleaks accepts a single [allowlist] map (not an array of tables), so the
# entries below share one block. The value regexes are anchored full-match
# literals, so they stay safe even though gitleaks applies them repo-wide.
[extend]
useDefault = true

[allowlist]
description = "Audited false positives (see comments; baseline 2026-08-22)"
paths = [
  # Local virtualenvs -- third-party code, never tracked.
  '''^\.venv/''',
  # Upstream-published OpenAPI specs (Mist et al.) whose documentation
  # examples (sample JWTs with 2022 exps, Google's public reCAPTCHA test
  # key, doc-placeholder hex, truncated PEM samples) trip generic rules.
  # The corpus is digest-pinned in vendor/openapi/MANIFEST.json and
  # reviewed at vendor time.
  '''^vendor/openapi/''',
  # mist.py lists Mist WebSocket gateway hostnames (api-ws.gc1..7.mist.com)
  # as routing facts; the generic-api-key rule matches the assignment
  # shape, not a secret. (Value shape also allowed by regex below, so a
  # different secret in this file still trips the scanner.)
  '''^src/hpe_networking_mcp/mcp_servers/mist\.py$''',
  # The migration orchestrator test embeds a PEM header inside an escaped
  # JSON string ("-----BEGIN PRIVATE KEY-----\nMIIF..."). The \n there is a
  # literal two-character escape, which never occurs in a real key file
  # (real PEMs contain actual newlines and the scanner captures the base64
  # body). Matched by regex below, path-listed here for documentation.
  '''^tests/unit/test_aos8_migration_orchestrator\.py$''',
]
regexes = [
  # Fixture literals in tests/scripts whose whole value is an obvious
  # marker string. Anchored full-value matches: a real credential pasted
  # into the same file still trips the scanner.
  '''^abcdef0123456789$''',
  '''^AKIA-disk-secret-[12]$''',
  '''^no-global-retention-secret-\d+$''',
  '''^placeholder-radius-secret-050$''',
  '''^GUID-[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$''',
  # Bare JWT header fragment used as a decoder fixture.
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9$''',
  # Mist WebSocket gateway hostnames in mist.py.
  '''api-ws\.gc\d+\.mist\.com''',
  # Escaped PEM fixture header (two-character backslash-n escape) in the
  # migration orchestrator test -- see path comment above.
  '''BEGIN PRIVATE KEY-----\\n''',
]
stopwords = [
  # Self-describing placeholders; a "secret" containing these words is by
  # construction not a real credential.
  "example",
  "placeholder",
]
