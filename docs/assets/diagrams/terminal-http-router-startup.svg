<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 942 608" preserveAspectRatio="xMidYMid meet" style="max-width: 942px; height: auto;" role="img" aria-labelledby="title desc" data-source-sha256="104be3b0d7a8339f47312bada5d4fda7e099fa4300b3c57f208977ea7a4256d9"><title id="title">Local streamable HTTP router startup transcript</title><desc id="desc">Terminal transcript of starting the local streamable HTTP router: the loopback endpoint, health routes, minimal router mode, and how to stop the foreground or background process.</desc><defs><style>text { font: 400 20px "SFMono-Regular", Consolas, "Liberation Mono", monospace; }.term-shell { fill: #05070d; }.term-frame { fill: #10182a; stroke: #3a4a63; stroke-width: 2; }.term-dot-red { fill: #ff5f56; }.term-dot-amber { fill: #ffbd2e; }.term-dot-green { fill: #27c93f; }.term-prompt { fill: #8be9fd; font-weight: 700; }.term-ok { fill: #6be675; }.term-warn { fill: #ffd866; }.term-fail { fill: #ff6e6e; }.term-dim { fill: #e6ecf7; }</style></defs><rect width="942" height="608" class="term-shell"/><rect x="12" y="12" width="918" height="584" rx="14" class="term-frame"/><circle cx="40" cy="40" r="7" class="term-dot-red"/><circle cx="64" cy="40" r="7" class="term-dot-amber"/><circle cx="88" cy="40" r="7" class="term-dot-green"/><text x="32" y="118" class="term-prompt">$ MCP_PORT=8010 bash scripts/run_http_router.sh</text><text x="32" y="148" class="term-dim">Starting hpe-networking-mcp HTTP router</text><text x="32" y="178" class="term-dim">  endpoint: http://127.0.0.1:8010/mcp</text><text x="32" y="208" class="term-dim">  health:   /livez, /readyz, /healthz (no auth needed)</text><text x="32" y="238" class="term-dim">  mode:     minimal</text><text x="32" y="268" class="term-dim">  toolsets: central,glp,rag</text><text x="32" y="298" class="term-dim">  products: none</text><text x="32" y="328" class="term-dim">  access:   read-only</text><text x="32" y="358" class="term-dim">  bearer:   disabled (set MCP_HTTP_BEARER_TOKEN to require it)</text><text x="32" y="388" class="term-dim">  metrics:  0 (http snapshot: 0)</text><text x="32" y="418" class="term-dim">  audit:    0</text><text x="32" y="478" class="term-dim">Foreground stop: Ctrl-C</text><text x="32" y="508" class="term-dim">Background stop:</text><text x="32" y="538" class="term-dim">  lsof -nP -iTCP:8010 -sTCP:LISTEN</text><text x="32" y="568" class="term-dim">  kill &lt;PID&gt;</text></svg>