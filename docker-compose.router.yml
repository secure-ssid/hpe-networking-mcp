# Optional overlay: adds a containerized hpe-networking-mcp streamable-HTTP
# router service alongside the existing Redis/Ollama backend defined in
# docker-compose.yml. This file changes nothing in docker-compose.yml and is
# inert on its own -- layer it on top explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.router.yml \
#     --profile router up -d --build mcp-router
#
# Security choices (see docs/production-deployment.md for the full writeup):
#   * "router" is a Compose *profile*, so a plain `docker compose up` (no
#     --profile router) starts only redis/ollama exactly as before -- this
#     overlay never changes default `docker-compose.yml` behavior.
#   * The published port is loopback-only ("127.0.0.1:8010:8010"), matching
#     the redis/ollama services already in docker-compose.yml.
#   * MCP_HOST=0.0.0.0 is required *inside* the container network namespace
#     for Docker's port-publish proxy to reach the process at all; the
#     loopback-only guarantee comes from the host-side "127.0.0.1:" bind
#     above, not from what the app binds to internally. MCP_ALLOWED_HOSTS /
#     MCP_ALLOWED_ORIGINS are set explicitly (exact port wildcards) because the
#     router refuses to start on a non-loopback MCP_HOST otherwise -- see
#     UnsafeHttpBindingError in src/hpe_networking_mcp/mcp_servers/shared.py.
#   * Credentials are never passed as plaintext `environment:` values. See
#     secrets/README.md for the CREDS_PATH file-secret and MCP_HTTP_BEARER_TOKEN
#     "*_FILE" conventions this service uses.
#   * **This is the exact-API-lookup deployment.** The image ships
#     /app/data/specs.sqlite -- 2,734 endpoints built offline from the 31
#     digest-pinned OpenAPI documents under vendor/openapi/ -- so `lookup_api`
#     answers with no network, no credentials and no provisioning step. The
#     default image installs no LanceDB/ONNX stack, so `ask_docs` answers from
#     that spec index instead of the prose corpus and `search_docs` returns
#     the degraded shape naming its remedy -- never a confident empty answer.
#   * **The default image does no prose retrieval by any backend.** `ask_docs`
#     and `search_docs` need a corpus you built yourself (`uv run python
#     ingestion/ingest_docs.py` -- scraped vendor documentation, not
#     redistributable, so it can never ship in the image) *and* a client for
#     it, and the default image installs neither: the embedded LanceDB stack
#     is in the `ingestion` extra and the `HPE_MCP_RAG_BACKEND=redis`
#     alternative is in the `redis` extra. Switching backends is not a way
#     around the corpus. Build once with what you need:
#
#       docker build --build-arg INSTALL_EXTRAS=ingestion \
#         -t hpe-networking-mcp-router:rag .
#
#     Then set `image:` to that tag and add the corpus mounts you need, e.g.
#     `- ./data/docs.lance:/app/data/docs.lance:ro`. They are not mounted by
#     default because the default image has no code that can open them.
#   * `/app/data` is never mounted as a whole. It holds the baked spec index,
#     so a `./data:/app/data:ro` mount would shadow it and leave the
#     documented deployment as the one path without the index the image just
#     built. Nothing is ever downloaded automatically by this file, the image
#     build, or the container's entrypoint.
#   * This overlay intentionally has no `depends_on`, so
#     `... --profile router up -d mcp-router` starts the router alone. That is
#     the right command for the default image: `redis` and `ollama` are in
#     docker-compose.yml's default profile, so omitting the service name
#     starts them too, and the default image has no client for either. They
#     are infrastructure for a RAG-enabled build and for running from source;
#     start them when you have one, and set HPE_MCP_RAG_BACKEND=redis only
#     against an image built with the `redis` extra.

services:
  mcp-router:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: ingestion
    image: hpe-networking-mcp-router:local
    profiles:
      - router
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8010"
      MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*"
      MCP_ALLOWED_ORIGINS: "http://127.0.0.1:*,http://localhost:*"
      HPE_MCP_ROUTER_MODE: "${HPE_MCP_ROUTER_MODE:-minimal}"
      HPE_MCP_TOOLSETS: "${HPE_MCP_TOOLSETS:-central,glp,rag}"
      HPE_MCP_ACCESS_PROFILE: "${HPE_MCP_ACCESS_PROFILE:-custom}"
      HPE_MCP_RAG_BACKEND: "${HPE_MCP_RAG_BACKEND:-}"
      HPE_MCP_PRODUCTS: "${HPE_MCP_PRODUCTS:-}"
      # Write posture. Compose injects only variables named here, so every
      # gate needs its own line or the per-platform model is inert in
      # containers. Each defaults to refused, which survives a deleted .env.
      HPE_MCP_PRODUCT_ACCESS: "${HPE_MCP_PRODUCT_ACCESS:-read-only}"
      HPE_MCP_CENTRAL_WRITES: "${HPE_MCP_CENTRAL_WRITES:-0}"
      HPE_MCP_GLP_V2BETA1_WRITES: "${HPE_MCP_GLP_V2BETA1_WRITES:-0}"
      HPE_MCP_AOS8_WRITES: "${HPE_MCP_AOS8_WRITES:-0}"
      HPE_MCP_EDGECONNECT_WRITES: "${HPE_MCP_EDGECONNECT_WRITES:-0}"
      HPE_MCP_APSTRA_WRITES: "${HPE_MCP_APSTRA_WRITES:-0}"
      HPE_MCP_MIST_WRITES: "${HPE_MCP_MIST_WRITES:-0}"
      HPE_MCP_CLEARPASS_WRITES: "${HPE_MCP_CLEARPASS_WRITES:-0}"
      HPE_MCP_UXI_WRITES: "${HPE_MCP_UXI_WRITES:-0}"
      HPE_MCP_AXIS_WRITES: "${HPE_MCP_AXIS_WRITES:-0}"
      CREDS_PATH: /run/secrets/credentials_yaml
      MCP_HTTP_BEARER_TOKEN_FILE: /run/secrets/mcp_http_bearer_token
    secrets:
      - credentials_yaml
      - mcp_http_bearer_token
    volumes:
      - router_state:/app/state
      - router_outputs:/app/outputs
    restart: unless-stopped

# Only the two secrets every deployment creates are declared here: compose
# fails to start when a declared secret's file is missing. Optional-product
# credentials get one file each, wired by
# `python3 scripts/setup_wizard.py --docker` into the generated
# docker-compose.router.local.yml; secrets/README.md shows the hand-rolled
# form for the same wiring.
secrets:
  credentials_yaml:
    file: ./secrets/credentials.yaml
  mcp_http_bearer_token:
    file: ./secrets/mcp_http_bearer_token

volumes:
  router_state:
  router_outputs:
